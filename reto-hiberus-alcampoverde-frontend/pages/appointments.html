<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendador de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .error-message {
            color: red;
            font-size: 0.8rem;
            min-height: 1rem;          
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Gestión Clínica</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="appointments.html">Citas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="patients.html">Pacientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="specialty.html">Especialidades</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Agendador de Citas</h1>

        <div class="card mb-4">
            <div class="card-header">
                <h3>Agendar Cita</h3>
            </div>
            <div class="card-body">
                <form id="appointmentForm" novalidate>
                    <div class="mb-3">
                        <label for="identification" class="form-label">Identificación:</label>
                        <input type="text" class="form-control" id="identification" name="identification" required>
                        <div id="identificationError" class="error-message"></div>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                        <div id="nameError" class="error-message"></div>
                    </div>
                    <div class="mb-3">
                        <label for="appointmentDate" class="form-label">Fecha de Cita:</label>
                        <input type="date" class="form-control" id="appointmentDate" name="appointmentDate" required>
                        <div id="appointmentDateError" class="error-message"></div>
                    </div>
                    <div class="mb-3">
                        <label for="specialtyId" class="form-label">Especialidad:</label>
                        <select class="form-select" id="specialtyId" name="specialtyId" required>
                            <option value="">Cargando especialidades...</option>
                        </select>
                        <div id="specialtyIdError" class="error-message"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Agendar Cita</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Citas Agendadas</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="appointmentsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Fecha</th>
                                <th>Nombre</th>
                                <th>Identificación</th>
                                <th>Especialidad</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                          
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="appointmentModal" tabindex="-1" aria-labelledby="appointmentModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="appointmentModalLabel">Detalles de la Cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modalAppointmentId">
                    <div class="mb-3">
                        <label for="modalIdentification" class="form-label">Identificación:</label>
                        <input type="text" class="form-control" id="modalIdentification">
                        <div id="modalIdentificationError" class="error-message"></div>
                    </div>
                    <div class="mb-3">
                        <label for="modalName" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="modalName">
                        <div id="modalNameError" class="error-message"></div>
                    </div>
                    <div class="mb-3">
                        <label for="modalAppointmentDate" class="form-label">Fecha de Cita:</label>
                        <input type="date" class="form-control" id="modalAppointmentDate">
                        <div id="modalAppointmentDateError" class="error-message"></div>
                    </div>
                    <div class="mb-3">
                        <label for="modalSpecialtyId" class="form-label">Especialidad:</label>
                        <select class="form-select" id="modalSpecialtyId" name="modalSpecialtyId" required>
                        </select>
                        <div id="modalSpecialtyIdError" class="error-message"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-danger" id="deleteAppointment">Eliminar</button>
                    <button type="button" class="btn btn-primary" id="updateAppointment">Actualizar</button>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../app/appointments.js"></script>

</body>

</html>
