<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Especialidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .error-message {
            color: red;
            font-size: 0.8rem;
            min-height: 1rem;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Gestión Clínica</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="appointments.html">Citas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="patients.html">Pacientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="specialty.html">Especialidades</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Gestión de Especialidades</h1>

       
        <div class="card mb-4">
            <div class="card-header">
                <h3>Registrar Nueva Especialidad</h3>
            </div>
            <div class="card-body">
                <form id="specialtyForm" novalidate>
                    <div class="mb-3">
                        <label for="specialtyName" class="form-label">Nombre de la Especialidad:</label>
                        <input type="text" class="form-control" id="specialtyName" name="specialtyName" required>
                        <div id="specialtyNameError" class="error-message"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Especialidad</button>
                </form>
            </div>
        </div>

       
        <div class="card">
            <div class="card-header">
                <h3>Especialidades Registradas</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="specialtiesTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                          
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

   
    <div class="modal fade" id="specialtyModal" tabindex="-1" aria-labelledby="specialtyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="specialtyModalLabel">Detalles de la Especialidad</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modalSpecialtyId">
                    <div class="mb-3">
                        <label for="modalSpecialtyName" class="form-label">Nombre de la Especialidad:</label>
                        <input type="text" class="form-control" id="modalSpecialtyName">
                        <div id="modalSpecialtyNameError" class="error-message"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-danger" id="deleteSpecialty">Eliminar</button>
                    <button type="button" class="btn btn-primary" id="updateSpecialty">Actualizar</button>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../app/specialty.js"></script>
    
</body>

</html>
